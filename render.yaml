services:
  - type: web
    name: statistic-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: statistic-site-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: statistic-site-files
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: statistic-site-db
    plan: free
